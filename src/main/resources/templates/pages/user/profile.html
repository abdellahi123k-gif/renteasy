<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="re-card p-4 text-center">
                <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #2563EB, #38BDF8); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                    <span class="fw-bold text-white" style="font-size: 1.8rem; font-family: 'Poppins', sans-serif;"
                          th:text="${currentUserInitials}">JD</span>
                </div>
                <h3 class="fw-bold" th:text="${user.firstName} + ' ' + ${user.lastName}">Nom</h3>
                <p class="text-muted mb-2" th:text="${user.email}">Email</p>
                <span class="re-badge" style="background: var(--re-primary-light); color: var(--re-primary); font-size: 0.9rem; padding: 0.4rem 1.2rem;" th:text="${user.role}">Rôle</span>
                <hr style="border-color: var(--re-border);" class="my-4">
                <div class="d-flex justify-content-center gap-3 flex-wrap">
                    <a th:href="@{/logements}" class="btn re-btn re-btn-primary" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                        <i class="bi bi-building"></i> <span th:text="#{profile.view_logements}">Logements</span>
                    </a>
                    <a th:href="@{/reservations}" class="btn re-btn re-btn-outline" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                        <i class="bi bi-calendar-check"></i> <span th:text="#{profile.view_reservations}">Réservations</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
