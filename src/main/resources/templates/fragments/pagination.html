<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="pagination(page)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <ul class="pagination justify-content-center re-pagination">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{'' (page=${page.number - 1}, size=${page.size})}">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{'' (page=${i}, size=${page.size})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{'' (page=${page.number + 1}, size=${page.size})}">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
