<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="re-card p-4">
                <div class="text-center mb-4">
                    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #DBEAFE, #E0E7FF); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="bi bi-calendar-plus" style="font-size: 1.5rem; color: var(--re-primary);"></i>
                    </div>
                    <h3 class="fw-bold mb-1" th:text="#{reservation.form.title}">Nouvelle réservation</h3>
                    <p class="text-muted small mb-0" th:text="#{reservation.form.subtitle}">Choisissez vos dates pour réserver ce logement</p>
                </div>

                <div th:if="${logement}" class="p-3 rounded-3 mb-4" style="background: linear-gradient(135deg, #DBEAFE, #E0E7FF);">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong th:text="${logement.titre}">Logement</strong><br>
                            <small style="color: var(--re-text-muted);" th:text="${logement.ville} + ' — ' + ${#numbers.formatDecimal(logement.prix, 1, 0)} + ' €'">Détails</small>
                        </div>
                        <i class="bi bi-building" style="font-size: 1.5rem; color: var(--re-primary); opacity: 0.5;"></i>
                    </div>
                </div>

                <form th:action="@{/reservations}" th:object="${reservationForm}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label for="dateDebut" class="form-label fw-medium" th:text="#{reservation.form.date_start}">Date d'arrivée</label>
                        <input type="date" id="dateDebut" th:field="*{dateDebut}"
                               th:errorclass="is-invalid" class="form-control re-input" required>
                        <div class="invalid-feedback" th:errors="*{dateDebut}">Error</div>
                    </div>
                    <div class="mb-4">
                        <label for="dateFin" class="form-label fw-medium" th:text="#{reservation.form.date_end}">Date de départ</label>
                        <input type="date" id="dateFin" th:field="*{dateFin}"
                               th:errorclass="is-invalid" class="form-control re-input" required>
                        <div class="invalid-feedback" th:errors="*{dateFin}">Error</div>
                    </div>
                    <button type="submit" class="btn re-btn re-btn-success w-100" style="display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.8rem;">
                        <i class="bi bi-check-lg"></i> <span th:text="#{reservation.form.submit}">Confirmer la réservation</span>
                    </button>
                    <input type="hidden" name="logementId" th:value="${param.logementId}">
                </form>

                <p class="text-center mt-3 mb-0">
                    <a th:href="@{/logements}" style="color: var(--re-primary); text-decoration: none; font-size: 0.9rem;">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{reservation.form.back}">Retour aux logements</span>
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
