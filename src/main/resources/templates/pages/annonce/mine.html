<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1"><i class="bi bi-megaphone" style="color: var(--re-success);"></i> <span th:text="#{annonce.mine.title}">Mes annonces</span></h1>
            <p class="text-muted mb-0 small" th:text="#{annonce.mine.subtitle}">Gérez vos annonces personnelles</p>
        </div>
        <a sec:authorize="hasAuthority('PROPRIETAIRE')" th:href="@{/annonces/new}"
           class="btn re-btn re-btn-primary" style="display: inline-flex; align-items: center; gap: 0.4rem;">
            <i class="bi bi-plus-lg"></i> <span th:text="#{annonce.mine.new}">Nouvelle annonce</span>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(annonces)}" class="re-empty-state">
        <i class="bi bi-megaphone"></i>
        <h5 th:text="#{annonce.mine.empty}">Vous n'avez pas encore d'annonces</h5>
        <p class="text-muted" th:text="#{annonce.mine.empty.hint}">Créez votre première annonce dès maintenant.</p>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(annonces)}">
        <div class="col-md-6" th:each="annonce : ${annonces}">
            <div class="re-card p-3">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="fw-bold mb-0" th:text="${annonce.titre}">Titre</h5>
                    <span th:if="${annonce.active}" class="re-badge" style="background: #DCFCE7; color: #16A34A;">
                        <i class="bi bi-check-circle-fill" style="font-size: 0.6rem;"></i> <span th:text="#{common.active}">Active</span>
                    </span>
                    <span th:unless="${annonce.active}" class="re-badge" style="background: #F1F5F9; color: #64748B;">
                        <i class="bi bi-pause-circle-fill" style="font-size: 0.6rem;"></i> <span th:text="#{common.inactive}">Inactive</span>
                    </span>
                </div>
                <p class="text-muted small mb-2" th:text="${annonce.description}">Desc</p>
                <div class="d-flex gap-3 mt-2 mb-3">
                    <span class="small" style="color: var(--re-text-muted);">
                        <i class="bi bi-building"></i> <span th:text="${annonce.logementTitre}">Logement</span>
                    </span>
                    <span class="small" style="color: var(--re-text-muted);">
                        <i class="bi bi-clock"></i>
                        <span th:text="${#temporals.format(annonce.datePublication, 'dd/MM/yyyy')}">Date</span>
                    </span>
                </div>
                <div class="d-flex gap-1">
                    <a th:if="${annonce.ownerId == currentUserId}"
                       th:href="@{/annonces/{id}/edit(id=${annonce.id})}" class="btn"
                       style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: #F59E0B; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500;">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:if="${annonce.ownerId == currentUserId}"
                          th:action="@{/annonces/{id}/delete(id=${annonce.id})}"
                          th:data-confirm="#{annonce.confirm.delete}"
                          method="post" style="display:inline" onsubmit="return confirm(this.getAttribute('data-confirm'))">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn"
                                style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: #EF4444; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500; border: none;">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                    <a th:href="@{/logements/{id}(id=${annonce.logementId})}" class="btn re-btn re-btn-primary" style="font-size: 0.8rem; padding: 0.4rem 1rem;">
                        <i class="bi bi-eye"></i> <span th:text="#{annonce.see.logement}">Voir le logement</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
