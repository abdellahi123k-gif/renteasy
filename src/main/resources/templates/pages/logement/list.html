<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1"><i class="bi bi-building" style="color: var(--re-primary);"></i> <span th:text="#{nav.logements}">Logements</span></h1>
            <p class="text-muted mb-0 small" th:text="#{logement.list.subtitle}">Découvrez tous les logements disponibles</p>
        </div>
        <a sec:authorize="hasAuthority('PROPRIETAIRE')" th:href="@{/logements/new}"
           class="btn re-btn re-btn-primary" style="display: inline-flex; align-items: center; gap: 0.4rem;">
            <i class="bi bi-plus-lg"></i> <span th:text="#{logement.new}">Nouveau logement</span>
        </a>
    </div>

    <div class="re-card-static p-3 mb-4">
        <form th:action="@{/logements}" method="get" class="row g-2">
            <div class="col-md-3">
                <div class="input-group">
                    <span class="input-group-text re-input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <input type="text" name="ville" class="form-control re-input" th:placeholder="#{common.city}" th:value="${param.ville}">
                </div>
            </div>
            <div class="col-md-2">
                <select name="type" class="form-select re-select">
                    <option value="" th:text="#{common.type}">Type</option>
                    <option value="Appartement" th:selected="${param.type == 'Appartement'}">Appartement</option>
                    <option value="Maison" th:selected="${param.type == 'Maison'}">Maison</option>
                    <option value="Studio" th:selected="${param.type == 'Studio'}">Studio</option>
                    <option value="Villa" th:selected="${param.type == 'Villa'}">Villa</option>
                </select>
            </div>
            <div class="col-md-2">
                <div class="input-group">
                    <span class="input-group-text re-input-group-text"><i class="bi bi-currency-euro"></i></span>
                    <input type="number" name="minPrix" class="form-control re-input" th:placeholder="#{logement.list.filter.min}" th:value="${param.minPrix}" step="0.01">
                </div>
            </div>
            <div class="col-md-2">
                <div class="input-group">
                    <span class="input-group-text re-input-group-text"><i class="bi bi-currency-euro"></i></span>
                    <input type="number" name="maxPrix" class="form-control re-input" th:placeholder="#{logement.list.filter.max}" th:value="${param.maxPrix}" step="0.01">
                </div>
            </div>
            <div class="col-md-1">
                <select name="disponible" class="form-select re-select">
                    <option value="" th:text="#{common.all}">Tous</option>
                    <option value="true" th:selected="${param.disponible == 'true'}" th:text="#{logement.list.filter.available_short}">Dispo</option>
                    <option value="false" th:selected="${param.disponible == 'false'}" th:text="#{logement.list.filter.unavailable_short}">Indispo</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn re-btn re-btn-primary w-100">
                    <i class="bi bi-search"></i> <span th:text="#{common.search}">Rechercher</span>
                </button>
            </div>
        </form>
    </div>

    <div th:if="${page.totalElements == 0}" class="re-empty-state">
        <i class="bi bi-building"></i>
        <h5 th:text="#{empty.logements}">Aucun logement trouvé</h5>
        <p class="text-muted" th:text="#{empty.logements.msg}">Essayez de modifier vos filtres de recherche.</p>
    </div>

    <div class="row g-4" th:if="${page.totalElements > 0}">
        <div class="col-md-6 col-lg-4" th:each="logement : ${page.content}">
            <div class="re-card h-100">
                <div class="featured-card-img" style="height: 200px; border-radius: var(--re-radius) var(--re-radius) 0 0; background: linear-gradient(135deg, #DBEAFE, #E0E7FF); overflow: hidden;">
                    <img th:if="${logement.imageUrl}" th:src="${logement.imageUrl}" alt="" style="width:100%; height:100%; object-fit:cover;">
                    <i class="bi bi-building" th:if="${logement.imageUrl == null}"></i>
                </div>
                <div class="p-3 d-flex flex-column">
                    <h5 class="fw-bold mb-1" th:text="${logement.titre}">Titre</h5>
                    <p class="text-muted small flex-grow-1 mb-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${logement.description}">Desc</p>
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <span class="re-badge" style="background: var(--re-primary-light); color: var(--re-primary);">
                            <i class="bi bi-geo-alt"></i> <span th:text="${logement.ville}">Ville</span>
                        </span>
                        <span class="re-badge" style="background: #F1F5F9; color: #475569;">
                            <i class="bi bi-tag"></i> <span th:text="${logement.type}">Type</span>
                        </span>
                        <span class="re-badge" style="background: #FEF3C7; color: #92400E;">
                            <i class="bi bi-currency-euro"></i> <span th:text="${#numbers.formatDecimal(logement.prix, 1, 0)} + ' €'">Prix</span>
                        </span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-auto">
                        <span th:if="${logement.disponible}" class="re-badge bg-success text-white" th:text="#{common.available}">Disponible</span>
                        <span th:unless="${logement.disponible}" class="re-badge bg-danger text-white" th:text="#{common.unavailable}">Indisponible</span>
                        <div class="d-flex gap-1">
                            <a th:if="${logement.ownerId == currentUserId}"
                               th:href="@{/logements/{id}/edit(id=${logement.id})}" class="btn"
                               style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: #F59E0B; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500;">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:if="${logement.ownerId == currentUserId}"
                                  th:action="@{/logements/{id}/delete(id=${logement.id})}"
                                  th:data-confirm="#{logement.confirm.delete}"
                                  method="post" style="display:inline" onsubmit="return confirm(this.getAttribute('data-confirm'))">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn"
                                        style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: #EF4444; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500; border: none;">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                            <a th:href="@{/logements/{id}(id=${logement.id})}" class="btn re-btn re-btn-primary" style="font-size: 0.8rem; padding: 0.4rem 1rem;">
                                <i class="bi bi-eye"></i> <span th:text="#{logement.details}">Détails</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4" th:replace="~{fragments/pagination :: pagination(${page})}"></div>
</div>
</body>
</html>
