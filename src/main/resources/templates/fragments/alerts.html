<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts">
    <div th:if="${success}" class="alert re-alert alert-success d-flex align-items-center gap-2 fade show" role="alert" style="border-radius: var(--re-radius-sm);">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${success}">Success</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert re-alert alert-danger d-flex align-items-center gap-2 fade show" role="alert" style="border-radius: var(--re-radius-sm);">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>
</body>
</html>
