<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb re-breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/reservations}" th:text="#{nav.reservations}">Réservations</a></li>
            <li class="breadcrumb-item active" th:text="#{reservation.detail.detail_label}">Détail</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="re-card p-4">
                <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
                    <div>
                        <h4 class="fw-bold mb-1"><span th:text="#{reservation.form.title}">Réservation</span> #<span th:text="${reservation.id}">ID</span></h4>
                        <span style="color: var(--re-text-muted); font-size: 0.9rem;">
                            <i class="bi bi-building"></i> <span th:text="${reservation.logementTitre}">Logement</span>
                            <span th:if="${reservation.locataireName}">
                                &middot; <i class="bi bi-person"></i> <span th:text="${reservation.locataireName}">Locataire</span>
                            </span>
                        </span>
                    </div>
                        <span th:switch="${reservation.status}"
                              th:classappend="|re-badge fs-6 px-3 py-2 ${reservation.status == 'CONFIRMEE' ? 'bg-success text-white' : (reservation.status == 'EN_ATTENTE' ? 'bg-warning text-dark' : 'bg-danger text-white')}|">
                            <span th:case="'CONFIRMEE'" th:text="#{reservation.status.confirmed}">Confirmée</span>
                            <span th:case="'EN_ATTENTE'" th:text="#{reservation.status.pending}">En attente</span>
                            <span th:case="'ANNULEE'" th:text="#{reservation.status.cancelled}">Annulée</span>
                        </span>
                </div>

                <hr style="border-color: var(--re-border);">

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <div class="p-4 rounded-3" style="background: linear-gradient(135deg, #DBEAFE, #E0E7FF);">
                            <small class="d-block mb-1" style="color: var(--re-primary); font-weight: 600;">
                                <i class="bi bi-calendar"></i> <span th:text="#{reservation.detail.arrival}">Arrivée</span>
                            </small>
                            <strong class="fs-4" style="color: var(--re-text);" th:text="${#temporals.format(reservation.dateDebut, 'dd/MM/yyyy')}">Début</strong>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="p-4 rounded-3" style="background: linear-gradient(135deg, #DCFCE7, #D1FAE5);">
                            <small class="d-block mb-1" style="color: var(--re-success); font-weight: 600;">
                                <i class="bi bi-calendar"></i> <span th:text="#{reservation.detail.departure}">Départ</span>
                            </small>
                            <strong class="fs-4" style="color: var(--re-text);" th:text="${#temporals.format(reservation.dateFin, 'dd/MM/yyyy')}">Fin</strong>
                        </div>
                    </div>
                </div>

                <hr style="border-color: var(--re-border);">

                <div class="d-flex gap-2 flex-wrap">
                    <form th:if="${reservation.status == 'EN_ATTENTE'}"
                          th:action="@{/reservations/{id}/confirm(id=${reservation.id})}" method="post"
                          sec:authorize="hasAuthority('PROPRIETAIRE')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn re-btn re-btn-success" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                            <i class="bi bi-check-lg"></i> <span th:text="#{reservation.detail.confirm_btn}">Confirmer</span>
                        </button>
                    </form>
                    <form th:if="${reservation.status != 'ANNULEE'}"
                          th:action="@{/reservations/{id}/cancel(id=${reservation.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn re-btn re-btn-danger" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                            <i class="bi bi-x-lg"></i> <span th:text="#{btn.cancel}">Annuler</span>
                        </button>
                    </form>
                    <a th:href="@{/reservations}" class="btn re-btn re-btn-outline" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{btn.back}">Retour</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
