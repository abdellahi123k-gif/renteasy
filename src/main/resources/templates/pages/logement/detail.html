<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb re-breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/logements}" th:text="#{nav.logements}">Logements</a></li>
            <li class="breadcrumb-item active" th:text="${logement.titre}">Titre</li>
        </ol>
    </nav>

    <div class="re-card overflow-hidden">
        <div class="featured-card-img" style="height: 300px; border-radius: 0; background: linear-gradient(135deg, #DBEAFE, #C7D2FE); overflow: hidden; position: relative;">
            <img th:if="${logement.imageUrl}" th:src="${logement.imageUrl}" alt="" style="width:100%; height:100%; position:absolute; top:0; left:0; object-fit:cover;">
            <i class="bi bi-building" th:if="${logement.imageUrl == null}" style="font-size: 5rem; opacity: 0.6; color: var(--re-primary);"></i>
            <span class="featured-card-badge" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); color: #fff; top: 16px; left: 16px; font-size: 0.85rem; padding: 0.4rem 1rem;"
                  th:classappend="${logement.disponible} ? '' : ''">
                <span th:if="${logement.disponible}" class="text-success"><span th:text="#{common.available}">● Disponible</span></span>
                <span th:unless="${logement.disponible}" class="text-danger"><span th:text="#{common.unavailable}">● Indisponible</span></span>
            </span>
        </div>
        <div class="p-4">
            <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1" th:text="${logement.titre}">Titre</h2>
                    <p class="text-muted mb-0">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${logement.ville}">Ville</span>
                        <span th:if="${logement.adresse}" th:text="| — ${logement.adresse}|">Adresse</span>
                    </p>
                </div>
                <div class="text-end">
                    <div class="fs-3 fw-bold" style="color: var(--re-primary);" th:text="${#numbers.formatDecimal(logement.prix, 1, 0)} + ' €'">Prix</div>
                    <small class="text-muted" th:text="#{logement.detail.per_month}">/ mois</small>
                </div>
            </div>

            <hr style="border-color: var(--re-border);">

            <div class="row g-3 mb-3">
                <div class="col-md-3 col-6">
                    <div class="p-3 rounded-3 text-center" style="background: var(--re-primary-light);">
                        <i class="bi bi-tag" style="color: var(--re-primary); font-size: 1.5rem;"></i>
                        <small class="d-block text-muted mt-1" th:text="#{common.type}">Type</small>
                        <strong th:text="${logement.type}">Type</strong>
                    </div>
                </div>
                <div class="col-md-2 col-6">
                    <div class="p-3 rounded-3 text-center" style="background: #DCFCE7;">
                        <i class="bi bi-currency-euro" style="color: var(--re-success); font-size: 1.5rem;"></i>
                        <small class="d-block text-muted mt-1" th:text="#{common.price}">Prix</small>
                        <strong th:text="${#numbers.formatDecimal(logement.prix, 1, 0)} + ' €'">Prix</strong>
                    </div>
                </div>
                <div class="col-md-2 col-6">
                    <div class="p-3 rounded-3 text-center" style="background: #E0E7FF;">
                        <i class="bi bi-person" style="color: #6366F1; font-size: 1.5rem;"></i>
                        <small class="d-block text-muted mt-1" th:text="#{nav.proprietaire}">Propriétaire</small>
                        <strong th:text="${logement.ownerName ?: 'N/A'}">Propriétaire</strong>
                    </div>
                </div>
                <div class="col-md-2 col-6">
                    <div class="p-3 rounded-3 text-center" style="background: #FEF3C7;">
                        <i class="bi bi-geo-alt" style="color: #F59E0B; font-size: 1.5rem;"></i>
                        <small class="d-block text-muted mt-1" th:text="#{common.city}">Ville</small>
                        <strong th:text="${logement.ville}">Ville</strong>
                    </div>
                </div>
                <div class="col-md-3 col-6" th:if="${logement.telephone}">
                    <div class="p-3 rounded-3 text-center" style="background: #F3E8FF;">
                        <i class="bi bi-telephone" style="color: #8B5CF6; font-size: 1.5rem;"></i>
                        <small class="d-block text-muted mt-1" th:text="#{logement.telephone}">Téléphone</small>
                        <strong th:text="${logement.telephone}">+212 6XX XXX XXX</strong>
                    </div>
                </div>
            </div>

            <p class="text-muted" th:text="${logement.description}">Description</p>

            <div class="row g-3 mb-3" th:if="${logement.imageUrl or logement.videoUrl}">
                <div class="col-md-6" th:if="${logement.imageUrl}">
                    <div class="p-3 rounded-3" style="background: #F1F5F9;">
                        <small class="d-block mb-1 fw-medium" style="color: var(--re-primary);"><i class="bi bi-images"></i> <span th:text="#{logement.detail.photo}">Photo</span></small>
                        <a th:href="${logement.imageUrl}" target="_blank" style="color: var(--re-primary); word-break: break-all;" th:text="${logement.imageUrl}">URL</a>
                    </div>
                </div>
                <div class="col-md-6" th:if="${logement.videoUrl}">
                    <div class="p-3 rounded-3" style="background: #EEF2FF;">
                        <small class="d-block mb-1 fw-medium" style="color: var(--re-info);"><i class="bi bi-film"></i> <span th:text="#{logement.detail.video}">Vidéo</span></small>
                        <a th:href="${logement.videoUrl}" target="_blank" style="color: var(--re-info); word-break: break-all;" th:text="${logement.videoUrl}">URL</a>
                    </div>
                </div>
            </div>

            <hr style="border-color: var(--re-border);">

            <div class="d-flex gap-2 flex-wrap">
                <a th:if="${isOwner}"
                   th:href="@{/logements/{id}/edit(id=${logement.id})}" class="btn" style="background: #F59E0B; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem;">
                    <i class="bi bi-pencil"></i> <span th:text="#{logement.edit}">Modifier</span>
                </a>
                    <form th:if="${isOwner}" th:action="@{/logements/{id}/delete(id=${logement.id})}"
                          th:data-confirm="#{logement.confirm.delete}"
                          method="post" style="display:inline" onsubmit="return confirm(this.getAttribute('data-confirm'))">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn" style="background: #EF4444; color: #fff; border-radius: var(--re-radius-sm); font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; border: none;">
                            <i class="bi bi-trash"></i> <span th:text="#{logement.delete}">Supprimer</span>
                    </button>
                </form>
                <a sec:authorize="hasAuthority('LOCATAIRE')" th:href="@{/reservations/new(logementId=${logement.id})}"
                   class="btn re-btn re-btn-success" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                    <i class="bi bi-calendar-plus"></i> <span th:text="#{btn.book}">Réserver</span>
                </a>
                <a th:href="@{/logements}" class="btn re-btn re-btn-outline" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{btn.back}">Retour</span>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
