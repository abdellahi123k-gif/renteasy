<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg fixed-top py-2" th:fragment="header" style="background: rgba(255,255,255,0.78); backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%); border-bottom: 1px solid rgba(226,232,240,0.5);">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" style="font-family: 'Poppins', sans-serif; font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, #2563EB, #38BDF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
            <i class="bi bi-house-door-fill" style="-webkit-text-fill-color: #2563EB;"></i> RentEasy
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHeader" style="padding: 0.4rem 0.6rem;">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarHeader">
            <ul class="navbar-nav me-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link rounded-pill" th:href="@{/logements}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-building"></i> <span th:text="#{nav.logements}">Logements</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link rounded-pill" th:href="@{/annonces}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-megaphone"></i> <span th:text="#{nav.annonces}">Annonces</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link rounded-pill" th:href="@{/reservations}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-calendar-check"></i> <span th:text="#{nav.reservations}">Mes réservations</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('PROPRIETAIRE')">
                    <a class="nav-link rounded-pill" th:href="@{/logements/mes-logements}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-house-check"></i> <span th:text="#{nav.my.logements}">Mes logements</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('PROPRIETAIRE')">
                    <a class="nav-link rounded-pill" th:href="@{/annonces/mes-annonces}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-megaphone"></i> <span th:text="#{nav.my.annonces}">Mes annonces</span>
                    </a>
                </li>
            </ul>
            <script>
                document.querySelectorAll('.navbar-nav .nav-link').forEach(function(link) {
                    if (link.getAttribute('href') === window.location.pathname) {
                        link.classList.add('active');
                        link.style.background = 'rgba(37,99,235,0.08)';
                        link.style.color = '#2563EB';
                    }
                });
            </script>
            <ul class="navbar-nav align-items-center gap-2">
                <li class="nav-item dropdown">
                    <button class="btn dropdown-toggle border-0 d-flex align-items-center gap-1"
                            data-bs-toggle="dropdown"
                            style="font-size:0.85rem; color:#64748B; padding:0.35rem 0.6rem; border-radius:100px; background:transparent; transition:all 0.2s;">
                        <i class="bi bi-globe2"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow mt-2" style="border:none; border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,0.1); padding:0.4rem; min-width:120px;">
                        <li><a class="dropdown-item rounded-3" href="#" onclick="switchLang('fr')" style="padding:0.45rem 1rem; border-radius:10px; font-size:0.9rem;"><span th:text="#{lang.fr}">Français</span></a></li>
                        <li><a class="dropdown-item rounded-3" href="#" onclick="switchLang('en')" style="padding:0.45rem 1rem; border-radius:10px; font-size:0.9rem;"><span th:text="#{lang.en}">English</span></a></li>
                        <li><a class="dropdown-item rounded-3" href="#" onclick="switchLang('ar')" style="padding:0.45rem 1rem; border-radius:10px; font-size:0.9rem;"><span th:text="#{lang.ar}">العربية</span></a></li>
                    </ul>
                    <script>
                    function switchLang(lang) {
                        var url = new URL(window.location.href);
                        url.searchParams.set('lang', lang);
                        window.location.href = url.toString();
                    }
                    </script>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link rounded-pill" th:href="@{/auth/login}"
                       style="font-weight:500; font-size:0.9rem; color:#475569; padding:0.5rem 1rem; transition:all 0.2s;">
                        <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{auth.login}">Connexion</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/auth/register}"
                       style="background:linear-gradient(135deg,#2563EB,#1D4ED8); color:#fff; border-radius:100px; padding:0.5rem 1.25rem; font-weight:600; font-size:0.85rem; text-decoration:none; transition:all 0.3s; display:inline-block;"
                       onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 25px rgba(37,99,235,0.35)';"
                       onmouseout="this.style.transform=''; this.style.boxShadow='';">
                        <i class="bi bi-person-plus"></i> <span th:text="#{auth.register}">Inscription</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <div class="dropdown">
                        <button class="btn d-flex align-items-center gap-2 dropdown-toggle border-0"
                                data-bs-toggle="dropdown"
                                style="background:rgba(37,99,235,0.08); border-radius:100px; padding:0.35rem 0.8rem 0.35rem 0.4rem; font-weight:500; color:#1E293B; transition:all 0.2s;"
                                onmouseover="this.style.background='rgba(37,99,235,0.15)'"
                                onmouseout="this.style.background='rgba(37,99,235,0.08)'">
                            <span class="rounded-circle d-inline-flex align-items-center justify-content-center fw-bold text-white"
                                  style="width:34px;height:34px;font-size:13px;background:linear-gradient(135deg,#2563EB,#38BDF8);"
                                  th:text="${currentUserInitials}">JD</span>
                            <span class="d-none d-md-inline" style="font-size:0.85rem;" th:text="${currentUserFirstName}">John</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow mt-2" style="border:none; border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,0.1); padding:0.5rem; min-width:220px;">
                            <li><a class="dropdown-item rounded-3" th:href="@{/users/profile}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                <i class="bi bi-person text-primary"></i> <span th:text="#{nav.profile}">Profil</span>
                            </a></li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li sec:authorize="hasAuthority('ADMIN')">
                                <a class="dropdown-item rounded-3" th:href="@{/dashboard/admin}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                    <i class="bi bi-speedometer2 text-primary"></i> <span th:text="#{nav.dashboard}">Dashboard</span> <span th:text="#{nav.admin}">Admin</span>
                                </a>
                            </li>
                            <li sec:authorize="hasAuthority('PROPRIETAIRE')">
                                <a class="dropdown-item rounded-3" th:href="@{/dashboard/proprietaire}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                    <i class="bi bi-speedometer2 text-success"></i> <span th:text="#{nav.dashboard}">Dashboard</span> <span th:text="#{nav.proprietaire}">Propriétaire</span>
                                </a>
                            </li>
                            <li sec:authorize="hasAuthority('LOCATAIRE')">
                                <a class="dropdown-item rounded-3" th:href="@{/dashboard/locataire}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                    <i class="bi bi-speedometer2 text-info"></i> <span th:text="#{nav.dashboard}">Dashboard</span> <span th:text="#{nav.locataire}">Locataire</span>
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li sec:authorize="hasAuthority('PROPRIETAIRE')">
                                <a class="dropdown-item rounded-3" th:href="@{/logements/mes-logements}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                    <i class="bi bi-house-check text-primary"></i> <span th:text="#{nav.my.logements}">Mes logements</span>
                                </a>
                            </li>
                            <li sec:authorize="hasAuthority('PROPRIETAIRE')">
                                <a class="dropdown-item rounded-3" th:href="@{/annonces/mes-annonces}" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s;">
                                    <i class="bi bi-megaphone text-success"></i> <span th:text="#{nav.my.annonces}">Mes annonces</span>
                                </a>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li>
                                <form th:action="@{/auth/logout}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="dropdown-item rounded-3" type="submit" style="padding:0.6rem 1rem; border-radius:10px; transition:all 0.15s; color:#EF4444;">
                                        <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Déconnexion</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
