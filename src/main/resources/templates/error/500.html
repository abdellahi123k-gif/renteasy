<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur - RentEasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .error-container {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
            padding: 3rem;
        }
        .error-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #FEE2E2, #FECACA);
            color: #DC2626;
            font-size: 2rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav style="background: rgba(255,255,255,0.8); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid rgba(0,0,0,0.05);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 py-3 text-decoration-none" th:href="@{/}">
                <span style="font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #2563EB, #38BDF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    <i class="bi bi-house-door-fill" style="-webkit-text-fill-color: #2563EB;"></i> RentEasy
                </span>
            </a>
        </div>
    </nav>
    <main class="container py-5 flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 text-center">
                <div class="error-container">
                    <div class="error-icon mx-auto">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h1 class="display-4 fw-bold mt-3" style="font-family: 'Poppins', sans-serif;">500</h1>
                    <p class="lead fw-semibold">Erreur interne du serveur</p>
                    <p class="text-muted">Une erreur inattendue s'est produite. Veuillez réessayer plus tard.</p>
                    <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill" style="background: linear-gradient(135deg, #2563EB, #1D4ED8); border: none; font-weight: 600;">
                        <i class="bi bi-house"></i> Retour à l'accueil
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
