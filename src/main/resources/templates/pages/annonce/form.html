<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="re-card p-4">
                <div class="text-center mb-4">
                    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #DCFCE7, #D1FAE5); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="bi bi-megaphone" style="font-size: 1.5rem; color: var(--re-success);"></i>
                    </div>
                    <h3 class="fw-bold mb-1">
                        <span th:text="${annonce != null} ? 'Modifier l\'annonce' : 'Publier une annonce'">Titre</span>
                    </h3>
                    <p class="text-muted small mb-0">
                        <span th:text="${annonce != null} ? 'Modifiez les informations de votre annonce' : 'Mettez en valeur votre logement auprès des locataires'">Sous-titre</span>
                    </p>
                </div>

                <form th:action="${annonce != null} ? @{/annonces/{id}(id=${annonce.id})} : @{/annonces}"
                      th:object="${annonceForm}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label for="titre" class="form-label fw-medium">Titre de l'annonce</label>
                        <input type="text" id="titre" th:field="*{titre}"
                               th:errorclass="is-invalid" class="form-control re-input" required>
                        <div class="invalid-feedback" th:errors="*{titre}">Error</div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <textarea id="description" th:field="*{description}"
                                  th:errorclass="is-invalid" class="form-control re-input" rows="4"></textarea>
                        <div class="invalid-feedback" th:errors="*{description}">Error</div>
                    </div>

                    <div class="mb-4">
                        <label for="logementId" class="form-label fw-medium">Logement</label>
                        <select id="logementId" th:field="*{logementId}"
                                th:errorclass="is-invalid" class="form-select re-select" required>
                            <option value="">Choisir un logement...</option>
                            <option th:each="logement : ${userLogements}"
                                    th:value="${logement.id}"
                                    th:text="${logement.titre} + ' - ' + ${logement.ville} + (${!logement.disponible} ? ' (Indisponible)' : '')">Logement</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{logementId}">Error</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn re-btn re-btn-success flex-grow-1" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;">
                            <i class="bi bi-megaphone"></i>
                            <span th:text="${annonce != null} ? 'Mettre à jour' : 'Publier'">Publier</span>
                        </button>
                        <a th:href="@{/annonces}" class="btn re-btn re-btn-outline" style="display: inline-flex; align-items: center; gap: 0.4rem;">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
