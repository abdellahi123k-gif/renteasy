<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - RentEasy'">Inscription - RentEasy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .auth-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
        }
        .auth-input {
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            background: #fff;
        }
        .auth-input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
            outline: none;
        }
        .auth-select {
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            background: #fff;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .auth-select:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
            outline: none;
        }
        .auth-btn {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            width: 100%;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37,99,235,0.3);
            color: #fff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <span style="font-family: 'Poppins', sans-serif; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #2563EB, #38BDF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                            <i class="bi bi-house-door-fill" style="-webkit-text-fill-color: #2563EB;"></i> RentEasy
                        </span>
                    </a>
                </div>

                <div class="auth-card p-4">
                    <div th:if="${success}" class="re-alert alert alert-success d-flex align-items-center gap-2" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Success</span>
                    </div>
                    <div th:if="${error}" class="re-alert alert alert-danger d-flex align-items-center gap-2" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}">Error</span>
                    </div>

                    <h4 class="fw-bold text-center mb-1" style="font-family: 'Poppins', sans-serif;" th:text="#{auth.register}">Inscription</h4>
                    <p class="text-muted text-center small mb-4" th:text="#{auth.register.subtitle}">Créez votre compte en quelques secondes</p>

                    <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label fw-medium" style="font-size: 0.9rem;" th:text="#{auth.register.firstname}">Prénom</label>
                                <input type="text" id="firstName" name="firstName" class="auth-input w-100" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label fw-medium" style="font-size: 0.9rem;" th:text="#{auth.register.lastname}">Nom</label>
                                <input type="text" id="lastName" name="lastName" class="auth-input w-100" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium" style="font-size: 0.9rem;" th:text="#{auth.register.email_label}">Email</label>
                            <input type="email" id="email" name="email" class="auth-input w-100" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium" style="font-size: 0.9rem;" th:text="#{auth.register.password_label}">Mot de passe</label>
                            <input type="password" id="password" name="password" class="auth-input w-100" required>
                        </div>
                        <div class="mb-4">
                            <label for="role" class="form-label fw-medium" style="font-size: 0.9rem;" th:text="#{auth.register.role_label}">Je suis</label>
                            <select id="role" name="role" class="auth-select w-100">
                                <option value="LOCATAIRE" th:text="#{nav.locataire}">Locataire</option>
                                <option value="PROPRIETAIRE" th:text="#{nav.proprietaire}">Propriétaire</option>
                            </select>
                        </div>
                        <button type="submit" class="auth-btn">
                            <i class="bi bi-person-plus"></i> <span th:text="#{auth.register}">S'inscrire</span>
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0" style="font-size: 0.9rem;">
                        <span th:text="#{auth.register.has_account}">Déjà un compte ?</span>
                        <a th:href="@{/auth/login}" style="color: #2563EB; font-weight: 600; text-decoration: none;" th:text="#{auth.login}">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
