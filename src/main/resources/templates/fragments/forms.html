<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="csrf" th:if="${_csrf != null}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
</div>

<div th:fragment="field-input(label, field)" class="mb-3">
    <label th:for="${#strings.toLowerCase(#strings.replace(field, '.', '_'))}"
           th:text="${label}" class="form-label fw-medium" style="font-size: 0.9rem;">Label</label>
    <input type="text" th:field="*{__${field}__}"
           th:errorclass="is-invalid"
           class="auth-input w-100"
           th:id="${#strings.toLowerCase(#strings.replace(field, '.', '_'))}">
    <div class="invalid-feedback" th:if="${#fields.hasErrors(field)}"
         th:errors="*{__${field}__}">Error</div>
</div>

<div th:fragment="field-textarea(label, field)" class="mb-3">
    <label th:for="${#strings.toLowerCase(#strings.replace(field, '.', '_'))}"
           th:text="${label}" class="form-label fw-medium" style="font-size: 0.9rem;">Label</label>
    <textarea th:field="*{__${field}__}"
              th:errorclass="is-invalid"
              class="auth-input w-100" rows="3"></textarea>
    <div class="invalid-feedback" th:if="${#fields.hasErrors(field)}"
         th:errors="*{__${field}__}">Error</div>
</div>

<div th:fragment="field-select(label, field, options)" class="mb-3">
    <label th:for="${#strings.toLowerCase(#strings.replace(field, '.', '_'))}"
           th:text="${label}" class="form-label fw-medium" style="font-size: 0.9rem;">Label</label>
    <select th:field="*{__${field}__}"
            th:errorclass="is-invalid"
            class="auth-select w-100">
        <option th:each="opt : ${options}" th:value="${opt}" th:text="${opt}">Option</option>
    </select>
    <div class="invalid-feedback" th:if="${#fields.hasErrors(field)}"
         th:errors="*{__${field}__}">Error</div>
</div>
</body>
</html>
